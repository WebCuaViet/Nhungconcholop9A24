```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Location Scanner</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top, #243b55, transparent 45%),
                linear-gradient(135deg, #050b16, #0b1525);

            color: white;
            padding: 30px 15px;
        }

        .container {
            width: 600px;
            max-width: 100%;

            padding: 35px;

            border-radius: 25px;

            background: rgba(15, 25, 40, 0.9);

            border: 1px solid rgba(0, 200, 255, 0.25);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(0, 200, 255, 0.08);

            backdrop-filter: blur(15px);

            text-align: center;
        }

        .icon {
            width: 80px;
            height: 80px;

            margin: 0 auto 20px;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 38px;

            background: rgba(0, 200, 255, 0.1);

            border: 2px solid #00c8ff;

            box-shadow:
                0 0 30px rgba(0, 200, 255, 0.3);
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #9fb3c8;
            font-size: 14px;
            margin-bottom: 28px;
        }

        button {
            width: 100%;

            padding: 15px;

            border: none;
            border-radius: 12px;

            background:
                linear-gradient(135deg, #00c8ff, #0077ff);

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;

            box-shadow:
                0 8px 25px rgba(0, 136, 255, 0.3);
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 35px rgba(0, 200, 255, 0.45);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        #status {
            margin-top: 20px;
            color: #8fa6bd;
            font-size: 14px;
        }

        .error {
            color: #ff6b6b !important;
        }

        /* =========================
           THÔNG TIN TỌA ĐỘ
        ========================= */

        .result {
            display: none;

            margin-top: 22px;

            padding: 20px;

            border-radius: 15px;

            background: rgba(0, 0, 0, 0.25);

            border: 1px solid rgba(255, 255, 255, 0.08);

            text-align: left;
        }

        .result.show {
            display: block;

            animation: appear 0.4s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .coordinate {
            margin: 10px 0;

            padding: 12px;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.05);
        }

        .label {
            display: block;

            color: #7f9bb5;

            font-size: 12px;

            margin-bottom: 5px;
        }

        .value {
            color: #00d9ff;

            font-weight: bold;

            word-break: break-all;
        }

        /* =========================
           BẢN ĐỒ
        ========================= */

        #map {
            display: none;

            width: 100%;
            height: 350px;

            margin-top: 20px;

            border-radius: 18px;

            overflow: hidden;

            border: 1px solid rgba(0, 200, 255, 0.25);

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.35);
        }

        #map.show {
            display: block;

            animation: mapAppear 0.6s ease;
        }

        @keyframes mapAppear {
            from {
                opacity: 0;
                transform: scale(0.97);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .map-button {
            display: block;

            margin-top: 15px;

            padding: 12px;

            text-align: center;

            border-radius: 10px;

            text-decoration: none;

            color: white;

            background: rgba(0, 200, 255, 0.12);

            border: 1px solid rgba(0, 200, 255, 0.25);

            transition: 0.2s;
        }

        .map-button:hover {
            background: rgba(0, 200, 255, 0.25);
        }

        .footer {
            margin-top: 20px;

            font-size: 11px;

            color: #61758a;
        }

        /* Marker đẹp hơn */
        .location-marker {
            width: 22px;
            height: 22px;

            background: #00c8ff;

            border: 3px solid white;

            border-radius: 50%;

            box-shadow:
                0 0 0 8px rgba(0, 200, 255, 0.2),
                0 0 25px rgba(0, 200, 255, 0.8);
        }
    </style>
</head>


<body>

<div class="container">

    <div class="icon">
        📍
    </div>

    <h1>
        Location Scanner
    </h1>

    <p class="subtitle">
        Xác định vị trí hiện tại của thiết bị
    </p>


    <button
        id="locationButton"
        onclick="getLocation()">

        📡 Lấy vị trí của tôi

    </button>


    <p id="status">
        Sẵn sàng quét vị trí
    </p>


    <!-- THÔNG TIN -->
    <div
        class="result"
        id="result">

        <div class="coordinate">

            <span class="label">
                VĨ ĐỘ
            </span>

            <span
                class="value"
                id="latitude">

                ---

            </span>

        </div>


        <div class="coordinate">

            <span class="label">
                KINH ĐỘ
            </span>

            <span
                class="value"
                id="longitude">

                ---

            </span>

        </div>


        <a
            id="mapLink"
            class="map-button"
            href="#"
            target="_blank">

            🌐 Mở trên Google Maps

        </a>

    </div>


    <!-- BẢN ĐỒ -->
    <div id="map"></div>


    <p class="footer">

        🔒 Vị trí chỉ được lấy khi bạn cho phép trình duyệt.

    </p>

</div>


<!-- Leaflet JS -->
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

let map = null;
let marker = null;


/* =========================
   LẤY VỊ TRÍ
========================= */

function getLocation() {

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("locationButton");

    const result =
        document.getElementById("result");

    const mapElement =
        document.getElementById("map");


    /* Kiểm tra trình duyệt */

    if (!navigator.geolocation) {

        status.textContent =
            "❌ Trình duyệt không hỗ trợ định vị.";

        status.className = "error";

        return;
    }


    /* Trạng thái */

    status.textContent =
        "📡 Đang xác định vị trí...";

    status.className = "";

    button.disabled = true;

    button.textContent =
        "⏳ Đang quét...";


    /* =========================
       GPS
    ========================= */

    navigator.geolocation.getCurrentPosition(

        (position) => {

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;


            /* Hiển thị tọa độ */

            document.getElementById(
                "latitude"
            ).textContent =
                lat.toFixed(7);


            document.getElementById(
                "longitude"
            ).textContent =
                lon.toFixed(7);


            /* Google Maps */

            document.getElementById(
                "mapLink"
            ).href =
                `https://www.google.com/maps?q=${lat},${lon}`;


            result.classList.add("show");


            /* =========================
               TẠO BẢN ĐỒ
            ========================= */

            mapElement.classList.add("show");


            /* Lần đầu */

            if (!map) {

                map = L.map("map").setView(
                    [lat, lon],
                    16
                );


                /* OpenStreetMap */

                L.tileLayer(
                    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                    {
                        maxZoom: 19,

                        attribution:
                            '&copy; OpenStreetMap contributors'
                    }
                ).addTo(map);


                /* Marker */

                const customIcon =
                    L.divIcon({
                        className: "",
                        html:
                            '<div class="location-marker"></div>',
                        iconSize: [22, 22],
                        iconAnchor: [11, 11]
                    });


                marker = L.marker(
                    [lat, lon],
                    {
                        icon: customIcon
                    }
                ).addTo(map);


                marker.bindPopup(
                    `
                    <b>📍 Vị trí hiện tại</b><br>
                    Vĩ độ: ${lat.toFixed(7)}<br>
                    Kinh độ: ${lon.toFixed(7)}
                    `
                ).openPopup();

            }

            /* Nếu quét lại */

            else {

                map.setView(
                    [lat, lon],
                    16
                );


                marker.setLatLng(
                    [lat, lon]
                );


                marker.bindPopup(
                    `
                    <b>📍 Vị trí hiện tại</b><br>
                    Vĩ độ: ${lat.toFixed(7)}<br>
                    Kinh độ: ${lon.toFixed(7)}
                    `
                );

            }


            /* Fix bản đồ khi xuất hiện */

            setTimeout(() => {

                map.invalidateSize();

            }, 200);


            /* Thành công */

            status.textContent =
                "✅ Đã xác định vị trí thành công.";

            button.disabled = false;

            button.textContent =
                "🔄 Quét lại vị trí";

        },


        /* =========================
           LỖI
        ========================= */

        (error) => {

            button.disabled = false;

            button.textContent =
                "📡 Lấy vị trí của tôi";


            status.className = "error";


            if (error.code === 1) {

                status.textContent =
                    "❌ Bạn đã từ chối quyền truy cập vị trí.";

            }

            else if (error.code === 2) {

                status.textContent =
                    "❌ Không thể xác định vị trí.";

            }

            else if (error.code === 3) {

                status.textContent =
                    "❌ Hết thời gian xác định vị trí.";

            }

            else {

                status.textContent =
                    "❌ Đã xảy ra lỗi khi lấy vị trí.";

            }

        },


        {
            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 0
        }

    );

}

</script>

</body>
</html>
```
